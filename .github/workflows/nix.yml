name: Build and test flake

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            kvm: true
          # GitHub's arm64 runners don't expose KVM, so the VM test can't run
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            kvm: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v3
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - run: nix build --print-build-logs
      - if: matrix.kvm
        run: nix flake check --print-build-logs
      # Builds the NixOS test system and lints the test script without booting
      # the VM
      - if: ${{ !matrix.kvm }}
        run: nix build --print-build-logs .#checks.${{ matrix.system }}.test.driver

  # Temporary: check whether nix-community's Namespace arm64 runners expose
  # KVM, so the aarch64 job could run the VM test there
  probe-kvm:
    runs-on: nscloud-ubuntu-24.04-arm64-4x8
    steps:
      - run: uname -a
      - run: |
          if [ -c /dev/kvm ]; then
            ls -l /dev/kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM: available and accessible"
            else
              echo "KVM: device exists but isn't accessible to $(id -un)"
            fi
          else
            echo "KVM: no /dev/kvm"
          fi
